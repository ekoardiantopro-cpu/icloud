<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Akses File</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }

    .running-container {
      width: 100%;
      overflow: hidden;
      border: 1px solid #2c3e50;
      padding: 5px 0;
      margin-bottom: 30px;
      background-color: #ecf0f1;
    }

    .running-text {
      display: inline-block;
      white-space: nowrap;
      font-size: 40px;
      font-weight: bold;
      color: #2c3e50;
      animation: move-left 10s linear infinite;
    }

    @keyframes move-left {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    input, button {
      padding: 10px;
      font-size: 16px;
    }

    #msg {
      margin-top: 10px;
      color: red;
    }
  </style>
</head>
<body>

  <div class="running-container">
    <div class="running-text">
      Masukkan Password untuk Mengakses File
    </div>
  </div>

  <input type="password" id="pw" placeholder="Password">
  <br><br>
  <button id="btn">Buka File</button>
  <p id="msg"></p>

  <script>
    const HASH_BENAR = "c55069d4b9eea8e4c16b3ed0e6091beb21080fa38553ce9155f70cd27320c21c";
    const LINK = "https://www.icloud.com/sharedalbum/#B1q532ODWKyb0qy";

    async function hashSHA256(text) {
      const data = new TextEncoder().encode(text);
      const buffer = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(buffer))
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");
    }

    async function cekPassword() {
      let input = document.getElementById("pw").value.trim();
      const msg = document.getElementById("msg");

      if (!input) {
        msg.textContent = "Password wajib diisi!";
        return;
      }

      try {
        const hasil = await hashSHA256(input);

        if (hasil === HASH_BENAR) {
          window.location.href = LINK;
        } else {
          msg.textContent = "Password salah Pantek!";
        }
      } catch (err) {
        msg.textContent = "Browser tidak mendukung fitur ini.";
        console.error(err);
      }
    }

    // event klik tombol
    document.getElementById("btn").addEventListener("click", cekPassword);

    // enter untuk submit
    document.getElementById("pw").addEventListener("keypress", function(e) {
      if (e.key === "Enter") cekPassword();
    });
  </script>

</body>
</html>
