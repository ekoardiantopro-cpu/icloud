<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Akses File</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }

    .running-container {
      width: 100%;
      overflow: hidden;
      border: 1px solid #2c3e50;
      padding: 5px 0;
      margin-bottom: 30px;
      background-color: #ecf0f1;
    }

    .running-text {
      display: inline-block;
      white-space: nowrap;
      font-size: 40px;
      font-weight: bold;
      color: #2c3e50;
      animation: move-left 10s linear infinite;
    }

    @keyframes move-left {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    input, button {
      padding: 10px;
      font-size: 16px;
    }

    button {
      cursor: pointer;
    }

    #msg {
      margin-top: 10px;
      color: red;
    }
  </style>
</head>
<body>

  <div class="running-container">
    <div class="running-text">Masukkan Password untuk Mengakses File</div>
  </div>

  <input type="password" id="pw" placeholder="Password">
  <br><br>
  <button onclick="cek()">Buka File</button>
  <p id="msg"></p>

  <script>
    // HASH dari password "@Bkl0306#"
    const HASH_BENAR = "3b0c8ac703f828b04c6c197006d17218f8d5c9b2c9a6f4b0b3c6bcb8d9d4f3f2";
    const TUJUAN = "https://www.icloud.com/sharedalbum/#B1q532ODWKyb0qy";

    // fungsi hash SHA-256
    async function sha256(text) {
      const encoder = new TextEncoder();
      const data = encoder.encode(text);
      const hashBuffer = await crypto.subtle.digest("SHA-256", data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
    }

    async function cek() {
      const input = document.getElementById("pw").value;
      const msg = document.getElementById("msg");

      if (!input) {
        msg.textContent = "Password wajib diisi!";
        return;
      }

      const hashInput = await sha256(input);

      if (hashInput === HASH_BENAR) {
        window.location.href = TUJUAN;
      } else {
        msg.textContent = "Password salah!";
      }
    }

    // tekan Enter untuk submit
    document.getElementById("pw").addEventListener("keypress", function(e) {
      if (e.key === "Enter") cek();
    });
  </script>

</body>
</html>
